      <main id="cartes">
         <article class="carte" id="p-alibellogres" data-personnage="p-alibellogres" data-lettre="A"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A161.png" alt=" Alibel de Logres "><span class="nom"> Alibel de Logres </span></span><span class="face verso"><span class="nom"> Alibel de Logres </span><span class="para"> Alibel de Logres portoit le premier
                     de Lozenges et l’autre d’Hermines.
                     Cestuy-cy ne fut pas sans
                     grand bruict et renom, et acquist
                     maintes choses en l’estat de toute
                     prouësse. </span></span></button></article>
         <article class="carte" id="p-andelisrouxserre" data-personnage="p-andelisrouxserre" data-lettre="A"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A81.png" alt=" Andelis le Roux Serré "><span class="nom"> Andelis le Roux Serré </span></span><span class="face verso"><span class="nom"> Andelis le Roux Serré </span><span class="para"> 
                     Andelis le Roux Serré portoit
                     d’argent à deux aisles de sable. 
                     Cestuy cy fut preux et hardy en
                     toutes ses affaires, et fut l’vn de la
                     table ronde. </span></span></button></article>
         <article class="carte" id="p-arthur" data-personnage="p-arthur" data-lettre="A"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A1.png" alt="Roy Artus"><span class="nom">Roy Artus</span></span><span class="face verso"><span class="nom">Roy Artus</span><span class="para"> Le Roy Artus portoit en ses armes d’Azur à treize couronnes
                     d’or. Il fut grand conquerant, et fit nobles et vaillantes prouësses. Il
                     institua l’ordre de la table ronde au pays de la grand Bretaigne, à laquelle
                     devoyent comparoir une fois l’an, au jour de la Pentecoste, tous les chevaliers
                     errans. </span></span></button></article>
         <article class="carte" id="p-artuspetit" data-personnage="p-artuspetit" data-lettre="A"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A61.png" alt=" Artus le petit "><span class="nom"> Artus le petit </span></span><span class="face verso"><span class="nom"> Artus le petit </span><span class="para"> Artus le petit portoit de sable à
                     vn sycamor d’or. Il estoit des
                     plus preux et puissans de son aage
                     et bien à dextre aux faicts d’armes
                     et de noblesse. </span></span></button></article>
         <article class="carte" id="p-brallain2e" data-personnage="p-brallain2e" data-lettre="B"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A41.png" alt=" Brallain, que lon disoit le cheualier aux deux espees "><span class="nom"> Brallain, que lon disoit le cheualier aux deux espees </span></span><span class="face verso"><span class="nom"> Brallain, que lon disoit le cheualier aux deux espees </span><span class="para"> Brallain, que lon disoit le cheualier 
                     aux deux espees portoit d’argent 
                     à vn sanglier de sable à trois
                     estoilles d’azur. Cestuy ne diminua 
                     pas l’estat de la table ronde,
                     ains l’ennoblit et multiplia abondamment.
                     </span></span></button></article>
         <article class="carte" id="p-enfantplesseis" data-personnage="p-enfantplesseis" data-lettre="E"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A101.png" alt=" L’enfant du Plesseis "><span class="nom"> L’enfant du Plesseis </span></span><span class="face verso"><span class="nom"> L’enfant du Plesseis </span><span class="para"> 
                     L’enfant du Plesseis portoit de
                     gueulles à trois roles d’argent. Les
                     trois roses d’argent insinuoyent et
                     donnoyent à coniecturer qu’il estoit
                     de noble et amoureux affaire.
                     </span></span></button></article>
         <article class="carte" id="p-percevaldegalles" data-personnage="p-percevaldegalles" data-lettre="P"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A141.png" alt=" Perceual de Galles. "><span class="nom"> Perceual de Galles. </span></span><span class="face verso"><span class="nom"> Perceual de Galles. </span><span class="para"> Perceual de Galles portoit de
                     pourpre semé de croisettes d’or.
                     Cestuy fut celuy qui s’assist au lieu
                     vague de la table ronde, qui estoit
                     seulement destiné à vn qui seroit
                     vierge, et de luy a esté compillé vn
                     hure que lon nomme Perceual. </span></span></button></article>
         <article class="carte" id="p-randouynpersien" data-personnage="p-randouynpersien" data-lettre="R"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A121.png" alt=" Randouyn le Persien "><span class="nom"> Randouyn le Persien </span></span><span class="face verso"><span class="nom"> Randouyn le Persien </span><span class="para"> Randouyn le Persien portoit de
                     sable à vne chapelle d’argent. Bien
                     peut estre qu’il estoit de Perse, dont
                     il portoit le nom, ou autrement surnommé
                     à plaisir, ou pour autre cause.
                     Ces armes semblent estre assez
                     nobles. </span></span></button></article>
         <article class="carte" id="p-sagremorld" data-personnage="p-sagremorld" data-lettre="S"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><img src="img/A21.png" alt=" Sagremor le Desrée "><span class="nom"> Sagremor le Desrée </span></span><span class="face verso"><span class="nom"> Sagremor le Desrée </span><span class="para"> Sagremor le Desrée portoit de
                     Sable à deux estoilles d’or a un quanton 
                     d’argent, dessus une estoille de
                     Sable. Assez bien paroist à son nom
                     et encore plus à ses armes qu’il estoit 
                     de grand cœur et souveraine
                     hardiesse comme l’un de ses consors
                     et associez à la table ronde. </span></span></button></article>
