      <main id="cartes">
         <article class="carte" id="p-roi" data-quadrille="q-romains" data-personnage="p-roi" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0101.png" alt="Un Soleil"><span class="devise"> UT VIDI, VICI</span><span class="nom">DU ROY</span></span><span class="face verso"><span class="nom">DU ROY</span><span class="para"> Il seroit mal-aisé de trouver un Corps de Devise qui
                     convint mieux au Roy que celuy du Soleil, veu le nombre presque infiny de
                     convenances illustres qui se rencontrent entre ce Grand Prince, et ce bel
                     Astre; Mais sans doute qu’une des plus remarquables, et qui est touchée par
                     cette Devise, est que comme le Soleil n’a qu’à se faire voir pour dissiper
                     les tenebres, ainsi ce Grand Monarque n’a besoin que de sa presence pour
                     vaincre ses ennemis. Ce qui est heureusement exprimé par ces mots, UT VIDI,
                     VICI, qui font allusion à ce mot de Jules Cesar, veni, vidi, vici. </span></span></button></article>
         <article class="carte" id="p-comtedevivonne" data-quadrille="q-romains" data-personnage="p-comtedevivonne" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0102.png" alt="Un Miroir ardant"><span class="devise">TUA MUNERA JACTO</span><span class="nom">COMTE DE VIVONNE</span></span><span class="face verso"><span class="nom">COMTE DE VIVONNE</span><span class="para"> Le Miroir ardant loin de renfermer en luy-méme la lumiere
                     du Soleil, la refléchit, et la renvoye de toutes parts avec encore plus de
                     force qu’elle ne luy est envoyée, et de cette sorte il est le symbole
                     parfait de la reconnoissance de ce Chevalier pour les bienfaits qu’il a
                     receus de Sa Majesté, qu’il s’efforce de faire éclater en tous lieux et en
                     toutes rencontres. </span></span></button></article>
         <article class="carte" id="p-comtedesaintagnan" data-quadrille="q-romains" data-personnage="p-comtedesaintagnan" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0103.png" alt="Un Laurier exposé au Soleil"><span class="devise">SOLI</span><span class="nom">COMTE DE SAINT-AGNAN</span></span><span class="face verso"><span class="nom">COMTE DE SAINT-AGNAN</span><span class="para"> Le Laurier est le symbole de la Victoire, qui a cela de
                     commun avec ce Chevalier, qu’elle ne veut appartenir qu’au Roy seul, et ne
                     se ranger jamais que de son party. </span></span></button></article>
         <article class="carte" id="p-comtedenavailles" data-quadrille="q-romains" data-personnage="p-comtedenavailles" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0104.png" alt=" Une Aigle regardant le Soleil "><span class="devise"> PROBASTI </span><span class="nom">COMTE DE NAVAILLES</span></span><span class="face verso"><span class="nom">COMTE DE NAVAILLES</span><span class="para"> On sçait que les Aigles éprouvent leurs Aiglons en les
                     exposant aux rayons du Soleil, et que ceux-là seulement sont reputez estre
                     veritablement de leur race qui en peuvent supporter l’éclat sans siller les
                     yeux. Ce Chevalier prétend de méme que les grands et illustres employs dont
                     le Roy l’a honoré, et qu’il a soûtenus avec gloire, sont des marques
                     assurées de son merite et de sa fidelité. </span></span></button></article>
         <article class="carte" id="p-comtedarmagnac" data-quadrille="q-romains" data-personnage="p-comtedarmagnac" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0105.png" alt=" Une Couronne de Laurier "><span class="devise"> HIC LABOR, HIC MERCES </span><span class="nom"> COMTE D'ARMAGNAC </span></span><span class="face verso"><span class="nom"> COMTE D'ARMAGNAC </span><span class="para"> Ce Chevalier se promet que la Victoire representée par
                     cette Couronne, estant le but de tous ses travaux, en sera pareillement
                     l’issuë et la recompense. </span></span></button></article>
         <article class="carte" id="p-comtedulude" data-quadrille="q-romains" data-personnage="p-comtedulude" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0106.png" alt=" Un Cadran exposé au Soleil "><span class="devise"> TE SINE NOMEN INERS </span><span class="nom"> COMTE DU LUDE </span></span><span class="face verso"><span class="nom"> COMTE DU LUDE </span><span class="para"> Quelque juste et bien fait que soit un Cadran, il ne peut
                     estre utile s’il n’est regardé du Soleil. Ce Chevalier reconnoit de même que
                     quelque merite qu’il puisse avoir en sa personne, il ne peut devenir
                     considerable qu’autant qu’il plaira à sa Majesté de le considerer, et de luy
                     donner moyen de mettre en usage les divers talens qu’il possede. </span></span></button></article>
         <article class="carte" id="p-comtedelouvigny" data-quadrille="q-romains" data-personnage="p-comtedelouvigny" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0107.png" alt=" Un Javelot fiché dans la terre "><span class="devise"> CERTASSE JUVABIT </span><span class="nom"> COMTE DE LOUVIGNY </span></span><span class="face verso"><span class="nom"> COMTE DE LOUVIGNY </span><span class="para"> Comme un javelot est toûjours prest au combat; de même ce
                     Chevalier assure qu’il ne demande autre chose que d’étre employé aux nobles
                     exercices de la guerre. </span></span></button></article>
         <article class="carte" id="p-comtedelafeuillade" data-quadrille="q-romains" data-personnage="p-comtedelafeuillade" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0108.png" alt=" Un Girasol tourné vers le Soleil "><span class="devise"> UNI </span><span class="nom"> COMTE DE LA FEUILLADE </span></span><span class="face verso"><span class="nom"> COMTE DE LA FEUILLADE </span><span class="para"> L'inclination que le Girasol témoigne pour le Soleil est
                     connuë de tout le monde; et c’est par ce symbole que le Chevalier qui le
                     prend pour sa Devise a voulu marquer la fidelité inviolable, avec laquelle
                     il veut s’attacher à son Prince, et n’avoir jamais d’autres mouvemens que
                     les siens. </span></span></button></article>
         <article class="carte" id="p-marquisdevillequier" data-quadrille="q-romains" data-personnage="p-marquisdevillequier" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0109.png" alt=" Une Aigle qui plane "><span class="devise"> UNI MILITAT ASTRO </span><span class="nom"> MARQUIS DE VILLEQUIER </span></span><span class="face verso"><span class="nom"> MARQUIS DE VILLEQUIER </span><span class="para"> L’Aigle accoûtumée à porter le foudre de Jupiter ne
                     voudroit point se charger des Armes d’une autre Divinité. Ce Chevalier
                     assure de même qu’il ne veut étre occupé qu’à la défense et à la garde de
                     son Prince qu’il regarde comme le seul Astre d’où dépend toute sa fortune.
                     </span></span></button></article>
         <article class="carte" id="p-marquisderichelieu" data-quadrille="q-romains" data-personnage="p-marquisderichelieu" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0110.png" alt=" Une Fusée volante "><span class="devise"> ARDO PARA SUBIR </span><span class="nom"> MARQUIS DE RICHELIEU </span></span><span class="face verso"><span class="nom"> MARQUIS DE RICHELIEU </span><span class="para"> Comme le feu qui brûle une fusée volante est cause de son
                     élevation, on peut dire de même que l’amour de la gloire, dont l’ame de ce
                     Chevalier est embrasée, en luy faisant produire de grandes actions, sera
                     cause de son élevation aux plus grands et plus illustres emplois. </span></span></button></article>
         <article class="carte" id="p-comtededuras" data-quadrille="q-romains" data-personnage="p-comtededuras" style="--couleur:#9b2335"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Romains</span><img src="img/0111.png" alt=" Un Lion regardant un Soleil "><span class="devise"> DE TUOI SGUARDI MIO ARDORE </span><span class="nom"> COMTE DE DURAS </span></span><span class="face verso"><span class="nom"> COMTE DE DURAS </span><span class="para"> Le Lion qui ne se plaît que dans les païs extremement
                     chauds, est redevable de l'ardeur de son courage à celle des rayons du
                     Soleil dont il est échauffé: Ainsi ce Chevalier déclare que sa valeur
                     s’augmente et se redouble par les regards favorables de son Prince. </span></span></button></article>
         <article class="carte" id="p-monsieur" data-quadrille="q-persans" data-personnage="p-monsieur" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0201.png" alt=" Une Lune en son plein "><span class="devise"> UNO SOLE MINOR </span><span class="nom"> DE MONSIEUR </span></span><span class="face verso"><span class="nom"> DE MONSIEUR </span><span class="para">
                     Comme la Lune particulierement en son plein surpasse de beaucoup les autres Astres
                     en grandeur et en lumiere;
                     en sorte qu’il n’y a que le Soleil qui ait en cela quelque avantage sur elle, on peut
                     dire, que c’est avec
                     beaucoup de justice que Monsieur Frere Unique du Roy l’a prise pour le corps de sa
                     Devise, puis qu’il ne voit
                     point de rang au dessus du sien que celuy de sa Majesté. Mais elle luy convient encore
                     particulierement en cette
                     rencontre, parce qu’il represente le Roy de Perse, qui s’estimant le plus grand de
                     tous les Roys, ne reconnoissoit 
                     au dessus de luy que le Soleil qu’il adoroit.
                     </span></span></button></article>
         <article class="carte" id="p-villeroy" data-quadrille="q-persans" data-personnage="p-villeroy" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0202.png" alt=" Un Dard entouré de Laurier "><span class="devise"> NEC SINE GLORIA CADET </span><span class="nom"> MARQUIS DE VILLEROY </span></span><span class="face verso"><span class="nom"> MARQUIS DE VILLEROY </span><span class="para">
                     De même que ce Dard est toûjours environné
                     de Laurier, quelque part qu’on le lance,
                     soit qu’il frappe au but, soit même qu’il
                     tombe à terre: Ainsi ce Chevalier a voulu
                     faire entendre que quelque expedition
                     qu’il entreprenne, elle sera toûjours accompagnée
                     de la gloire dont le Laurier est
                     le symbole, soit qu’elle luy reüssisse avantageusement,
                     soit méme qu’il y perde la vie.
                     </span></span></button></article>
         <article class="carte" id="p-plessis" data-quadrille="q-persans" data-personnage="p-plessis" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0203.png" alt=""><span class="devise">AB OBICE MAJOR</span><span class="nom">COMTE DU PLESSIS</span></span><span class="face verso"><span class="nom">COMTE DU PLESSIS</span><span class="para">
                     L’activité et la violence du feu s’augmentent
                     par la resistance qu’il rencontre, et
                     plus il est resserré, plus il éclate; Il en est de
                     même d’un grand courage, qui sent redoubler
                     son ardeur, soit dans la guerre, soit
                     dans l’amour, par les obstacles et les difficultez
                     qui se presentent.
                     </span></span></button></article>
         <article class="carte" id="p-bellefond" data-quadrille="q-persans" data-personnage="p-bellefond" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0204.png" alt=""><span class="devise">UNA SIN MAS</span><span class="nom">MARQUIS DE BELLEFOND</span></span><span class="face verso"><span class="nom">MARQUIS DE BELLEFOND</span><span class="para">
                     Comme une Abeille, aprés avoir consideré
                     toutes les fleurs d’un Parterre, enfin
                     s’attache à une seule; De même ce Chevalier
                     fait entendre par cette Devise, qu’encore
                     qu’il ait beaucoup de civilité, et d’inclination 
                     pour toutes les Dames; Il y en a
                     une neantmoins qui a toutes ses affections,
                     et à laquelle son cœur est particulierement
                     attaché.
                     </span></span></button></article>
         <article class="carte" id="p-rohan" data-quadrille="q-persans" data-personnage="p-rohan" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0205.png" alt="Des Lauriers sur des charbons ardans"><span class="devise">ARDER Y CALLAR ?</span><span class="nom">CHEVALIER DE ROHAN</span></span><span class="face verso"><span class="nom">CHEVALIER DE ROHAN</span><span class="para">
                     Ce feu peut representer ou celuy de la
                     gloire ou celuy de l’amour, mais de quelque
                     sorte qu’on l’interprete, ce Chevalier declare
                     qu’il luy est aussi impossible d’en brûler
                     sans faire du bruit, soit en faisant parler
                     de luy par ses belles actions, soit en parlant
                     de son ardeur à celle qui en est la cause, qu’il
                     est mal aisé que des Lauriers se laissent consumer
                     par le feu qui les brûle sans faire
                     beaucoup de bruit et beaucoup d’éclat.
                     </span></span></button></article>
         <article class="carte" id="p-lislebonne" data-quadrille="q-persans" data-personnage="p-lislebonne" style="--couleur:#2f6f8f"><button type="button" class="carte-inner" aria-pressed="false"><span class="face recto"><span class="quadrille">Persans</span><img src="img/0206.png" alt="Un flambeau en plein jour"><span class="devise">NOLLEM CESSISSE MINORI</span><span class="nom">COMTE DE L’ISLEBONNE</span></span><span class="face verso"><span class="nom">COMTE DE L’ISLEBONNE</span><span class="para">
